[package]
name = "xopp-rust"
version = "0.1.0"
edition = "2021"
authors = ["Mirco Negri <mirco.negri@example.com>"]
description = "High-performance modern handwritten note-taking app compatible with Xournal++"
license = "GPL-2.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "winit"] }
egui = "0.29"
flate2 = "1.0"
quick-xml = "0.36"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.15"
chrono = "0.4"
